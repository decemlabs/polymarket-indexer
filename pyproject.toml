[project]
name = "polymarket-indexer"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.20.0",
    "asyncpg>=0.30.0",
    "psycopg-pool>=3.2.0",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.15.0",
    "tortoise-orm>=0.21.0",
    "web3>=8.0.0",
]

[project.scripts]
polymarket-indexer = "indexer.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/indexer"]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
